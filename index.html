<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NeedyBD.com</title><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><style>@import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');*{margin:0;padding:0;box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}body{background:#f5f7fb}header{background:#111827;color:#fff;padding:25px;text-align:center}header h1{font-size:36px}header h1 span{color:#22c55e}.search{background:#fff;padding:18px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;box-shadow:0 4px 12px rgba(0,0,0,.08);position:sticky;top:0;z-index:10}.search select,.search input{padding:11px 14px;border:1px solid #ddd;border-radius:10px;min-width:160px}.search button{background:#111827;color:#fff;border:none;padding:11px 22px;border-radius:10px;font-weight:700}.container{max-width:1100px;margin:25px auto;padding:0 15px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}.card{background:#fff;border-radius:16px;box-shadow:0 5px 18px rgba(0,0,0,.06);border:1px solid #eee}.top{padding:18px;display:flex;gap:14px;align-items:center}.avatar{width:60px;height:60px;border-radius:50%;background:#dcfce7;display:flex;align-items:center;justify-content:center;font-size:26px}.admin{max-width:500px;margin:40px auto;background:#fff;padding:28px;border-radius:16px}.admin input{width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:10px}</style></head><body><div id="main"><header><h1>NeedyBD<span>.com</span></h1><p>প্রয়োজন আপনার, সমাধান আমাদের</p></header><div class="search"><select id="fPesh"><option value="all">সকল পেশা</option><option>রাজমিস্ত্রী</option><option>ইলেকট্রিশিয়ান</option><option>প্লাম্বার</option><option>ডাক্তার</option></select><select id="fLoc"><option value="all">সকল জেলা</option><option>ঢাকা</option><option>চট্টগ্রাম</option><option>রাজশাহী</option></select><input id="fSearch" placeholder="নাম লিখুন..."><button onclick="doFilter()">খুঁজুন</button></div><div class="container" id="cards">লোড হচ্ছে...</div></div><div id="adminPage" style="display:none;background:#111827;min-height:100vh;padding:20px;color:#fff"><div id="loginBox" class="admin" style="color:#000;text-align:center"><h2>NeedyBD.com</h2><p>মালিক লগইন</p><input id="aU" placeholder="soleman"><input id="aP" type="password" placeholder="needy123"><button onclick="login()" style="width:100%;padding:12px;background:#111827;color:#fff;border:none;border-radius:10px;margin-top:10px;font-weight:700">লগইন</button><p id="lMsg" style="color:red"></p></div><div id="dash" style="display:none;max-width:900px;margin:auto"><h1>স্বাগতম সোলেমান 👑</h1><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0"><div style="background:#1f2937;padding:18px;border-radius:12px"><h2 id="tW">0</h2><p>Total Workers</p></div><div style="background:#1f2937;padding:18px;border-radius:12px"><h2 id="tV">0</h2><p>Visitors</p></div></div><div class="admin" style="color:#000;max-width:100%"><h3>নতুন কর্মী যোগ করুন</h3><input id="wN" placeholder="নাম"><input id="wP" placeholder="পেশা"><input id="wL" placeholder="জেলা"><input id="wE" placeholder="অভিজ্ঞতা"><input id="wR" placeholder="রেটিং"><button onclick="addW()" style="width:100%;padding:12px;background:#111827;color:#fff;border:none;border-radius:10px;margin-top:10px">Save</button><button onclick="location.href=location.pathname" style="width:100%;padding:10px;background:#eee;border:none;border-radius:8px;margin-top:12px">সাইটে ফিরে যান</button></div></div></div><script>const firebaseConfig={apiKey:"AIzaSyCQ-kmWlvSZBA_Onrz2266C9POCpHxC2eY",authDomain:"needybd-70d0b.firebaseapp.com",databaseURL:"https://needybd-70d0b-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"needybd-70d0b",storageBucket:"needybd-70d0b.firebasestorage.app",messagingSenderId:"77403593681",appId:"1:77403593681:web:998b92623d7dcd75f69ef0"};firebase.initializeApp(firebaseConfig);const db=firebase.database();let workers=[];function load(){db.ref('workers').on('value',snap=>{const data=snap.val();if(!data){const def={w1:{name:"আব্দুল করিম",pesh:"রাজমিস্ত্রী",loc:"ঢাকা",exp:"12 বছর",rating:"4.9",icon:"👷"},w2:{name:"রফিক ইলেকট্রিক",pesh:"ইলেকট্রিশিয়ান",loc:"ঢাকা",exp:"8 বছর",rating:"4.8",icon:"💡"},w3:{name:"ডা. সুমাইয়া",pesh:"ডাক্তার",loc:"রাজশাহী",exp:"5 বছর",rating:"5.0",icon:"🩺"}};db.ref('workers').set(def);workers=Object.values(def);}else{workers=Object.values(data);}render(workers);const tw=document.getElementById('tW');if(tw)tw.innerText=workers.length+" জন";});db.ref('visitors').transaction(c=>(c||0)+1);db.ref('visitors').on('value',s=>{const tv=document.getElementById('tV');if(tv)tv.innerText=(s.val()||0)+" জন";});}function render(list){const c=document.getElementById('cards');c.innerHTML="";list.forEach(w=>{c.innerHTML+=`<div class="card"><div class="top"><div class="avatar">${w.icon||'👤'}</div><div><h3>${w.name}</h3><p>${w.exp} | ⭐ ${w.rating}</p><span style="background:#dcfce7;color:#15803d;padding:2px 10px;border-radius:20px;font-size:12px">${w.pesh} | ${w.loc}</span></div></div><div style="padding:0 18px 18px;display:flex;justify-content:space-between"><button style="padding:7px 16px;border-radius:20px;border:1px solid #ddd;background:#fff">প্রোফাইল</button><button style="padding:7px 16px;border-radius:20px;border:none;background:#111827;color:#fff">হায়ার</button></div></div>`;});}function doFilter(){const p=document.getElementById('fPesh').value,l=document.getElementById('fLoc').value,s=document.getElementById('fSearch').value.toLowerCase();render(workers.filter(w=>(p==='all'||w.pesh===p)&&(l==='all'||w.loc===l)&&w.name.toLowerCase().includes(s)));}function addW(){const w={name:document.getElementById('wN').value,pesh:document.getElementById('wP').value,loc:document.getElementById('wL').value,exp:document.getElementById('wE').value,rating:document.getElementById('wR').value,icon:"👷"};if(!w.name)return alert("নাম দিন");db.ref('workers').push(w).then(()=>{alert("Database এ যোগ হয়েছে!");document.getElementById('wN').value="";});}if(window.location.search.includes("admin")){document.getElementById('main').style.display="none";document.getElementById('adminPage').style.display="block";}function login(){if(document.getElementById('aU').value==="soleman"&&document.getElementById('aP').value==="needy123"){document.getElementById('loginBox').style.display="none";document.getElementById('dash').style.display="block";}else document.getElementById('lMsg').innerText="ভুল পাসওয়ার্ড";}load();</script></body></html>
